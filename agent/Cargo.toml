[package]
name = "servicedesk-agent"
version = "0.1.0"
edition = "2021"
default-run = "servicedesk-agent"
build = "build.rs"

[dependencies]
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
sysinfo = "0.38"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
